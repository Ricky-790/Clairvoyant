
[project]
name = "worker_services"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "db",
    "e2b>=2.55.1",
    "redis>=8.1.0",
]

[tool.uv.sources]
db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resources", "workers"]
