
[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
    "itsdangerous>=2.2.0",
    "authlib>=1.8.0",
    "joserfc>=1.7.5",
    "db",
    "pydantic>=2.14.0",
]

[tool.uv.sources]
db = { workspace = true }
worker_services = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]
