[project]
name = "db"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "dotenv>=0.9.9",
    "psycopg>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "sqlalchemy[asyncio]>=2.1.4",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "services", "session"]
